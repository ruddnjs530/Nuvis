package robot.gateway.v1;

// gRPC Gateway API 서비스
service RobotGateway {
  // 1. ExecuteTask — 작업 실행 (Action)
  rpc ExecuteTask (ExecuteTaskRequest) returns (ExecuteTaskResponse) {}

  // 2. CancelTask — 작업 취소
  rpc CancelTask (CancelTaskRequest) returns (CancelTaskResponse) {}

  // 3. EmergencyStop — 긴급 정지
  rpc EmergencyStop (EmergencyStopRequest) returns (EmergencyStopResponse) {}

  // 4. ManualControl — 수동 제어
  rpc ManualControl (ManualControlRequest) returns (ManualControlResponse) {}

  // 5. GetStatus — 상태 조회 (단건)
  rpc GetStatus (GetStatusRequest) returns (RobotStatusResponse) {}

  // 6. StreamStatus — 상태 스트림 (Server Streaming)
  rpc StreamStatus (StreamStatusRequest) returns (stream RobotStatusResponse) {}
}

// --- Enums ---

