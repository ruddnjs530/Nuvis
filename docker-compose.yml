version: '3.8'

services:
  # MySQL 데이터베이스
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: nuvis_db
      MYSQL_ROOT_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - ./db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # React 프론트엔드 (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

  # Node.js 백엔드
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - DB_HOST=db
      - DB_NAME=nuvis_db
      - DB_USER=root
      - DB_PASSWORD=1234
    depends_on:
      - db
    restart: always
