services:
  ros2-dev:
    build:
      context: .
      dockerfile: docker/ros2/Dockerfile
    image: b110-ros2:humble
    container_name: b110-ros2-dev
    working_dir: /workspace/ros2_ws
    stdin_open: true
    tty: true
    environment:
      ROS_DOMAIN_ID: "42"
      RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"
      PYTHONUNBUFFERED: "1"
      ROS_TCP_ENDPOINT_PORT: "10000"
#    ports:
#      - "50051:50051"
#      - "10000:10000"
    volumes:
      - ./ros2_ws:/workspace/ros2_ws
      - ./scripts:/workspace/scripts
    command: bash

  ros2-run:
    build:
      context: .
      dockerfile: docker/ros2/Dockerfile
    image: b110-ros2:humble
    container_name: b110-ros2-run
    working_dir: /workspace/ros2_ws
    stdin_open: true
    tty: true
    environment:
      ROS_DOMAIN_ID: "42"
      RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"
      PYTHONUNBUFFERED: "1"
      ROS_TCP_ENDPOINT_PORT: "10000"
    ports:
      - "50051:50051"
      - "10000:10000"
    volumes:
      - ./ros2_ws:/workspace/ros2_ws
      - ./scripts:/workspace/scripts
    command: >
      bash -lc
      "cd /workspace/ros2_ws &&
       colcon build --symlink-install --packages-select ros_tcp_endpoint robot_msgs robot_core robot_nav robot_gateway &&
       source install/setup.bash &&
       ros2 launch robot_core robot_system.launch.py"

  ros2-rviz:
    build:
      context: .
      dockerfile: docker/ros2/Dockerfile
    image: b110-ros2:humble
    container_name: b110-ros2-rviz
    working_dir: /workspace/ros2_ws
    stdin_open: true
    tty: true
    depends_on:
      - ros2-run
    environment:
      ROS_DOMAIN_ID: "42"
      RMW_IMPLEMENTATION: "rmw_fastrtps_cpp"
      DISPLAY: ${DISPLAY:-:0}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-/mnt/wslg/runtime-dir}
      PULSE_SERVER: ${PULSE_SERVER:-/mnt/wslg/PulseServer}
      QT_QPA_PLATFORM: "xcb"
      QT_X11_NO_MITSHM: "1"
      XAUTHORITY: ${XAUTHORITY:-/mnt/wslg/.Xauthority}
    volumes:
      - ./ros2_ws:/workspace/ros2_ws
      - ./scripts:/workspace/scripts
      - /mnt/wslg/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
    command: >
      bash -lc
      "cd /workspace/ros2_ws &&
       export DISPLAY=${DISPLAY:-:0} &&
       export WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0} &&
       export XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-/mnt/wslg/runtime-dir} &&
       if [ ! -S /tmp/.X11-unix/X0 ]; then
         echo '[ros2-rviz] ERROR: X11 socket /tmp/.X11-unix/X0 not found.';
         echo '[ros2-rviz] Run docker compose from a WSL shell with WSLg enabled.';
         echo '[ros2-rviz] Hint: check /mnt/wslg/.X11-unix/X0 and env DISPLAY/WAYLAND_DISPLAY.';
         ls -al /tmp/.X11-unix || true;
         ls -al /mnt/wslg/.X11-unix || true;
         exit 1;
       fi &&
       for i in {1..600}; do
         [ -f install/setup.bash ] && break;
         echo '[ros2-rviz] waiting for install/setup.bash...';
         sleep 1;
       done &&
       [ -f install/setup.bash ] &&
       source install/setup.bash &&
       rviz2 -d /workspace/ros2_ws/src/robot_nav/config/nav_debug.rviz"

  # 1. 프론트엔드
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smarthome_frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/nginx/ssl:ro
    restart: always

  # 2. 백엔드
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smarthome_backend
    environment:
      # .env 파일의 값을 불러옵니다.
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # 3. 데이터베이스
  db:
    image: mysql:8
    container_name: smarthome_db
    restart: always
    environment:
      # .env 에서 불러옵니다.
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

volumes:
  db_data:
