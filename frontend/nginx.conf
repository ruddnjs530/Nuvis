# 1. HTTP (:80) -> HTTPS (:443) 자동 리다이렉트
server {
    listen 80;
    server_name j14b110.p.ssafy.io;

    # 모든 HTTP 요청을 HTTPS로 리다이렉트
    return 301 https://$host$request_uri;
}

# 2. HTTPS (:443) 서버 블록
server {
    listen 443 ssl;
    server_name j14b110.p.ssafy.io;

    # SSL 인증서 경로 (docker-compose에서 마운트한 경로)
    ssl_certificate /etc/nginx/ssl/live/j14b110.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/j14b110.p.ssafy.io/privkey.pem;

    # SSL 보안 강화 옵션 (권장)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 프론트엔드 React 화면 서빙
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # /api/ 로 시작하는 요청은 전부 백엔드(3000번) 컨테이너로 전달
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /jenkins/ {
        proxy_pass http://jenkins:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
