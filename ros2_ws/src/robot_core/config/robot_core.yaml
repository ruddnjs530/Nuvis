state_manager_node:
  ros__parameters:
    robot_id: "R1"
    publish_rate_hz: 2.0
    default_battery_pct: 100.0
    prefer_unity_pose: true
    unity_pose_topic: "/unity/robot_pose"
    unity_pose_timeout_sec: 5.0
    unity_origin_offset_x: 0.0
    unity_origin_offset_y: 0.0
    unity_yaw_offset_rad: 0.0
    unity_scale: 1.0

heartbeat_node:
  ros__parameters:
    robot_id: "R1"
    publish_rate_hz: 1.0
    node_name_override: "robot_core"

sensor_fusion_node:
  ros__parameters:
    source: "sim_env"
    publish_rate_hz: 2.0
    base_temperature: 24.0
    base_humidity: 45.0
    base_pm25: 18.0

module_controller_node:
  ros__parameters:
    state_publish_rate_hz: 1.0

safety_manager_node:
  ros__parameters:
    warning_battery_pct: 20.0
    return_battery_pct: 15.0
    simulate_battery: true
    # 2Hz 기준 0.0035/tick -> 약 0.007%/sec
    # 100% -> 15% 도달까지 약 3.37시간
    battery_drain_per_tick: 0.0035
    battery_publish_rate_hz: 2.0

task_executor_node:
  ros__parameters:
    default_timeout_sec: 300
    always_return_home: false
    simulation_step_sec: 0.5
    navigation_path_mode: "graph"
    nav_execution_mode: "through_poses"
    waypoints_file: ""
    routes_file: ""
    graph_file: ""
    rooms_file: ""
    graph_snap_radius: 2.5
    graph_stick_radius: 0.8
    default_home_zone: "hq"
    graph_path_cache_enabled: true
    graph_path_cache_max_entries: 512
    segment_timeout_min_sec: 30
    segment_timeout_base_sec: 10
    segment_timeout_per_meter_sec: 8.0
    module_state_wait_sec: 2.0
    module_service_timeout_sec: 3.0
